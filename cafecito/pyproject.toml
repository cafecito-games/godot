[project]
name = "cafecito-build"
version = "0.1.0"
description = "Build, packaging, and Relink Kit tooling for the Cafecito Godot fork"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cafecito-build = "cafecito_build.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cafecito_build"]
