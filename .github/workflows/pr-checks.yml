name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SCONS_CACHE_DIR: ${{ github.workspace }}/.scons-cache

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Run cafecito-build tests
        run: uv run --project cafecito --with pytest pytest cafecito/tests -q

  cpp-tests:
    name: C++ unit tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Detect engine or test changes
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          changed_files=""
          if [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${PR_NUMBER}" ]; then
            if ! changed_files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')"; then
              echo "Could not query PR files via API; running C++ tests."
              echo "run=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            file_count="$(printf '%s\n' "${changed_files}" | grep -c . || true)"
            if [ "${file_count}" -eq 0 ] || [ "${file_count}" -ge 3000 ]; then
              echo "PR file list empty or at API pagination cap (${file_count}); running C++ tests."
              echo "run=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          elif [ "${EVENT_NAME}" = "push" ] && [ -n "${PUSH_BEFORE_SHA}" ] && [ "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            if ! changed_files="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${PUSH_BEFORE_SHA}...${GITHUB_SHA}" --jq '.files[].filename')"; then
              echo "Could not query push diff via API; running C++ tests."
              echo "run=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            file_count="$(printf '%s\n' "${changed_files}" | grep -c . || true)"
            if [ "${file_count}" -eq 0 ] || [ "${file_count}" -ge 300 ]; then
              echo "Push diff empty or at compare API cap (${file_count}); running C++ tests."
              echo "run=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          else
            echo "Could not resolve base commit; running C++ tests."
            echo "run=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "Changed files:"
          echo "${changed_files}"

          if printf '%s\n' "${changed_files}" | grep -qE '^(core|drivers|editor|main|modules|platform|scene|servers|tests|thirdparty)/|^(SConstruct|version\.py|methods\.py|platform_methods\.py|scu_builders\.py|gles3_builders\.py|glsl_builders\.py)$|^cafecito/(relink_manifest\.py|src/cafecito_build/scons\.py)$|^\.github/workflows/pr-checks\.yml$'; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "No engine, test, or build-system files changed; skipping C++ tests."
            echo "run=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout
        if: steps.changes.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Set up uv
        if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@v10.4.0

      - name: Install mold linker
        if: steps.changes.outputs.run == 'true'
        uses: rui314/setup-mold@v1

      - name: Restore main SCons cache
        id: restore-main-cache
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: ${{ env.SCONS_CACHE_DIR }}
          key: pr-linux-tests-v2-main-${{ github.sha }}
          restore-keys: |
            pr-linux-tests-v2-main-

      - name: Record baseline cache files
        if: steps.changes.outputs.run == 'true' && github.ref_name != 'main' && steps.restore-main-cache.outputs.cache-matched-key != ''
        run: |
          if [ -d "${SCONS_CACHE_DIR}" ]; then
            find "${SCONS_CACHE_DIR}" -mindepth 2 -type f > redundant.txt
          fi

      - name: Restore PR SCons cache
        id: restore-pr-cache
        if: steps.changes.outputs.run == 'true' && github.ref_name != 'main'
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: ${{ env.SCONS_CACHE_DIR }}
          key: pr-linux-tests-v2-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            pr-linux-tests-v2-${{ github.ref_name }}-

      - name: Record build start timestamp
        if: steps.changes.outputs.run == 'true'
        run: |
          sleep 1
          echo "CACHE_TIMESTAMP=$(date +%s)" >> "${GITHUB_ENV}"

      - name: Build Godot with C++ unit tests
        if: steps.changes.outputs.run == 'true'
        run: |
          uv run --project cafecito --with "scons==4.10.1" cafecito-build build \
            --platform linuxbsd \
            --target editor \
            --arch x86_64 \
            --tests \
            --no-relink-kit \
            --extra-flag optimize=none \
            --extra-flag linker=mold \
            --extra-flag use_static_cpp=no \
            --extra-flag scu_limit=48 \
            --extra-flag wayland=no \
            --extra-flag accesskit=no \
            --extra-flag sdl=no \
            --extra-flag alsa=no \
            --extra-flag pulseaudio=no \
            --extra-flag dbus=no \
            --extra-flag speechd=no \
            --extra-flag fontconfig=no \
            --extra-flag udev=no \
            --extra-flag touch=no \
            --extra-flag "cache_path=${SCONS_CACHE_DIR}" \
            --extra-flag cache_limit=5

      - name: Prune SCons cache
        id: prune-cache
        if: >-
          steps.changes.outputs.run == 'true' &&
          ((github.ref_name == 'main' && steps.restore-main-cache.outputs.cache-hit != 'true') ||
           (github.ref_name != 'main' && steps.restore-pr-cache.outputs.cache-hit != 'true'))
        run: |
          python3 misc/scripts/purge_cache.py "${CACHE_TIMESTAMP}" "${SCONS_CACHE_DIR}"
          rm -f redundant.txt
          if [ -d "${SCONS_CACHE_DIR}" ] && [ -n "$(find "${SCONS_CACHE_DIR}" -mindepth 2 -type f -print -quit)" ]; then
            echo "has_files=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_files=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Save SCons cache
        if: steps.prune-cache.outputs.has_files == 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ env.SCONS_CACHE_DIR }}
          key: pr-linux-tests-v2-${{ github.ref_name }}-${{ github.sha }}

      - name: Ping main SCons cache
        if: steps.changes.outputs.run == 'true' && github.ref_name != 'main'
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: ${{ env.SCONS_CACHE_DIR }}
          key: pr-linux-tests-v2-main-${{ github.sha }}
          restore-keys: |
            pr-linux-tests-v2-main-
          lookup-only: true

      - name: Run C++ unit tests
        if: steps.changes.outputs.run == 'true'
        run: |
          ./bin/godot.linuxbsd.editor.x86_64 --version
          ./bin/godot.linuxbsd.editor.x86_64 --headless --test --force-colors
