name: Build Public Godot Fork & Relink Kits

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag override (leave empty to auto-generate as v{godot}-{date}.{N})'
        required: false
        type: string
        default: ''
      publish_release:
        description: 'Publish GitHub Release (set false for build-only verification / dry runs)'
        required: false
        type: boolean
        default: true
      build_macos_arm64:
        description: 'Build macOS Apple Silicon editor + templates + Relink Kits'
        required: false
        type: boolean
        default: true
      build_ios:
        description: 'Build iOS templates (device arm64 + simulator arm64) + Relink Kits'
        required: false
        type: boolean
        default: true
      build_apple_libgodot:
        description: 'Build Apple LibGodot SDK (release slices) + Relink Kits'
        required: false
        type: boolean
        default: false
      build_android:
        description: 'Build Android templates (arm64-v8a + x86_64) + Relink Kits'
        required: false
        type: boolean
        default: false
      build_linux:
        description: 'Build Linux x86_64 templates (linux-template_release/debug.tar.gz) + Relink Kits'
        required: false
        type: boolean
        default: true
      build_linux_editor:
        description: 'Build Linux x86_64 editor + Relink Kit'
        required: false
        type: boolean
        default: false
      build_windows:
        description: 'Build Windows x86_64 templates (MinGW) + Relink Kits'
        required: false
        type: boolean
        default: false

env:
  SCONS_CACHE_DIR: ${{ github.workspace }}/.scons-cache
  SCONS_CACHE_LIMIT_GIB: '5'
  SCONS_VERSION: '4.10.1'
  REQUIRED_IOS_SDK_MAJOR: '27'
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'

jobs:
  generate-tag:
    name: Generate Release Tag
    if: inputs.publish_release
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      template_version: ${{ steps.tag.outputs.template_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Derive release tag and template version
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GODOT_VERSION=$(grep -E '^(major|minor|patch) = [0-9]+' version.py | awk -F' = ' '{print $2}' | tr '\n' '.' | sed 's/\.$//')
          GODOT_STATUS=$(awk -F' = ' '/^status = / {gsub(/"/, "", $2); print $2}' version.py)
          echo "template_version=${GODOT_VERSION}.${GODOT_STATUS}" >> "$GITHUB_OUTPUT"

          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "release_tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DATE=$(date -u +%Y%m%d)
          COUNT=$(gh release list --repo "${{ github.repository }}" --limit 100 \
            --json tagName \
            --jq "[.[] | select(.tagName | startswith(\"v${GODOT_VERSION}-${DATE}.\"))] | length")
          NEXT=$((COUNT + 1))
          echo "release_tag=v${GODOT_VERSION}-${DATE}.${NEXT}" >> "$GITHUB_OUTPUT"

  build-macos-arm64:
    name: Build macOS arm64 (${{ matrix.target }})
    if: inputs.build_macos_arm64
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target: [editor, template_release, template_debug]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0

      - name: Configure Xcode toolchain PATH and ensure zstd
        run: |
          toolchain_bin="$(dirname "$(xcrun --find clang)")"
          echo "${toolchain_bin}" >> "${GITHUB_PATH}"
          echo "Prepended macOS toolchain bin to PATH: ${toolchain_bin}"
          command -v zstd >/dev/null || brew install zstd

      - name: Resolve Vulkan SDK version
        id: vulkan-version
        run: |
          version="$(curl -fsSL https://sdk.lunarg.com/sdk/download/latest/mac/config.json | jq -r '.version')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Restore MoltenVK cache
        id: restore-moltenvk
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: ~/VulkanSDK/${{ steps.vulkan-version.outputs.version }}/macOS/lib/MoltenVK.xcframework
          key: macos-moltenvk-v1-${{ steps.vulkan-version.outputs.version }}

      - name: Install Vulkan SDK
        if: steps.restore-moltenvk.outputs.cache-hit != 'true'
        run: bash misc/scripts/install_vulkan_sdk_macos.sh

      - name: Save MoltenVK cache
        if: steps.restore-moltenvk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ~/VulkanSDK/${{ steps.vulkan-version.outputs.version }}/macOS/lib/MoltenVK.xcframework
          key: macos-moltenvk-v1-${{ steps.vulkan-version.outputs.version }}

      - name: Restore SCons cache
        id: restore-cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: ${{ env.SCONS_CACHE_DIR }}
          key: release-v3-macos-arm64-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            release-v3-macos-arm64-${{ matrix.target }}-
            release-v2-macos-arm64-
            macos-arm64-

      - name: Record build start timestamp
        run: |
          sleep 1
          echo "CACHE_TIMESTAMP=$(date +%s)" >> "${GITHUB_ENV}"

      - name: Build macOS arm64 ${{ matrix.target }} and Relink Kit
        run: |
          mkdir -p release-out
          uv run --project cafecito --with "scons==${SCONS_VERSION}" cafecito-build build \
            --platform macos \
            --target "${{ matrix.target }}" \
            --arch arm64 \
            --extra-flag "cache_path=${SCONS_CACHE_DIR}" \
            --extra-flag "cache_limit=${SCONS_CACHE_LIMIT_GIB}"
          uv run --project cafecito cafecito-build package-relink-kit \
            --manifest "bin/godot.macos.${{ matrix.target }}.arm64.relink.json" \
            --output-dir release-out

      - name: Dump extension API from macOS editor
        if: matrix.target == 'editor'
        run: |
          mkdir -p extension-api-out
          (cd extension-api-out && ../bin/godot.macos.editor.arm64 --headless --dump-extension-api)

      - name: Prune SCons cache
        id: prune-cache
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: |
          python3 misc/scripts/purge_cache.py "${CACHE_TIMESTAMP}" "${SCONS_CACHE_DIR}"
          if [ -d "${SCONS_CACHE_DIR}" ] && [ -n "$(find "${SCONS_CACHE_DIR}" -mindepth 2 -type f -print -quit)" ]; then
            echo "has_files=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_files=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Save SCons cache
        if: steps.prune-cache.outputs.has_files == 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ env.SCONS_CACHE_DIR }}
          key: release-v3-macos-arm64-${{ matrix.target }}-${{ github.sha }}

      - name: Upload macOS Relink Kit
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64-kit-${{ matrix.target }}
          path: release-out/*
          retention-days: 1

      - name: Upload macOS binary for bundle packaging
        uses: actions/upload-artifact@v7
        with:
          name: internal-macos-arm64-bin-${{ matrix.target }}
          path: bin/godot.macos.${{ matrix.target }}.arm64
          retention-days: 1

      - name: Upload macOS extension API artifact
        if: matrix.target == 'editor'
        uses: actions/upload-artifact@v7
        with:
          name: internal-macos-extension-api
          path: extension-api-out/extension_api.json
          retention-days: 1

  package-macos-arm64:
    name: Package macOS (arm64) Bundles
    needs: [build-macos-arm64]
    if: inputs.build_macos_arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0

      - name: Download macOS arm64 binaries
        uses: actions/download-artifact@v8
        with:
          pattern: internal-macos-arm64-bin-*
          path: bin
          merge-multiple: true

      - name: Package public macOS editor and template bundles
        run: |
          mkdir -p release-out
          uv run --project cafecito cafecito-build package-macos-editor \
            --editor-binary bin/godot.macos.editor.arm64 \
            --output release-out/godot_macos_editor.arm64.zip
          uv run --project cafecito cafecito-build package-macos-template \
            --release-binary bin/godot.macos.template_release.arm64 \
            --debug-binary bin/godot.macos.template_debug.arm64 \
            --output release-out/macos-arm64.zip

      - name: Upload macOS bundles
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64-bundles
          path: release-out/*
          retention-days: 1

  build-ios:
    name: Build iOS (${{ matrix.target }} / ${{ matrix.variant }})
    if: inputs.build_ios
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: template_release
            variant: device
            ios_simulator: 'no'
            manifest_suffix: ''
          - target: template_release
            variant: simulator
            ios_simulator: 'yes'
            manifest_suffix: '.simulator'
          - target: template_debug
            variant: device
            ios_simulator: 'no'
            manifest_suffix: ''
          - target: template_debug
            variant: simulator
            ios_simulator: 'yes'
            manifest_suffix: '.simulator'
    outputs:
      xcode_version: ${{ steps.xcode.outputs.xcode_version }}
      ios_sdk_version: ${{ steps.xcode.outputs.ios_sdk_version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0

      - name: Select and verify Xcode / iOS SDK
        id: xcode
        run: uv run --project cafecito cafecito-build select-xcode --min-ios-sdk "${REQUIRED_IOS_SDK_MAJOR}"

      - name: Ensure zstd is available
        run: command -v zstd >/dev/null || brew install zstd

      - name: Restore SCons cache
        id: restore-cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: ${{ env.SCONS_CACHE_DIR }}
          key: release-v3-ios-${{ matrix.target }}-${{ matrix.variant }}-sdk-${{ steps.xcode.outputs.ios_sdk_version }}-${{ github.sha }}
          restore-keys: |
            release-v3-ios-${{ matrix.target }}-${{ matrix.variant }}-sdk-${{ steps.xcode.outputs.ios_sdk_version }}-
            release-v2-ios-sdk-${{ steps.xcode.outputs.ios_sdk_version }}-
            ios-sdk-${{ steps.xcode.outputs.ios_sdk_version }}-

      - name: Record build start timestamp
        run: |
          sleep 1
          echo "CACHE_TIMESTAMP=$(date +%s)" >> "${GITHUB_ENV}"

      - name: Build iOS slice and Relink Kit
        run: |
          mkdir -p release-out ios-slice-stage
          uv run --project cafecito --with "scons==${SCONS_VERSION}" cafecito-build build \
            --platform ios \
            --target "${{ matrix.target }}" \
            --arch arm64 \
            --extra-flag "ios_simulator=${{ matrix.ios_simulator }}" \
            --extra-flag "cache_path=${SCONS_CACHE_DIR}" \
            --extra-flag "cache_limit=${SCONS_CACHE_LIMIT_GIB}"
          uv run --project cafecito cafecito-build package-relink-kit \
            --manifest "bin/libgodot.ios.${{ matrix.target }}.arm64${{ matrix.manifest_suffix }}.a.relink.json" \
            --output-dir release-out
          for archive in bin/libgodot*.ios.${{ matrix.target }}.arm64${{ matrix.manifest_suffix }}.a; do
            if [ -f "$archive" ]; then
              cp "$archive" ios-slice-stage/
            fi
          done

      - name: Prune SCons cache
        id: prune-cache
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: |
          python3 misc/scripts/purge_cache.py "${CACHE_TIMESTAMP}" "${SCONS_CACHE_DIR}"
          if [ -d "${SCONS_CACHE_DIR}" ] && [ -n "$(find "${SCONS_CACHE_DIR}" -mindepth 2 -type f -print -quit)" ]; then
            echo "has_files=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_files=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Save SCons cache
        if: steps.prune-cache.outputs.has_files == 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ env.SCONS_CACHE_DIR }}
          key: release-v3-ios-${{ matrix.target }}-${{ matrix.variant }}-sdk-${{ steps.xcode.outputs.ios_sdk_version }}-${{ github.sha }}

      - name: Upload iOS Relink Kit
        uses: actions/upload-artifact@v7
        with:
          name: release-ios-kit-${{ matrix.target }}-${{ matrix.variant }}
          path: release-out/*
          retention-days: 1

      - name: Upload iOS slice libraries for bundle packaging
        uses: actions/upload-artifact@v7
        with:
          name: internal-ios-slice-${{ matrix.target }}-${{ matrix.variant }}
          path: ios-slice-stage/*
          retention-days: 1

  package-ios:
    name: Package iOS Template Bundle
    needs: [build-ios]
    if: inputs.build_ios
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0

      - name: Resolve Vulkan SDK version
        id: vulkan-version
        run: |
          version="$(curl -fsSL https://sdk.lunarg.com/sdk/download/latest/mac/config.json | jq -r '.version')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Restore MoltenVK cache
        id: restore-moltenvk
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: ~/VulkanSDK/${{ steps.vulkan-version.outputs.version }}/macOS/lib/MoltenVK.xcframework
          key: macos-moltenvk-v1-${{ steps.vulkan-version.outputs.version }}

      - name: Install Vulkan SDK (MoltenVK for ios.zip)
        if: steps.restore-moltenvk.outputs.cache-hit != 'true'
        run: bash misc/scripts/install_vulkan_sdk_macos.sh

      - name: Save MoltenVK cache
        if: steps.restore-moltenvk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ~/VulkanSDK/${{ steps.vulkan-version.outputs.version }}/macOS/lib/MoltenVK.xcframework
          key: macos-moltenvk-v1-${{ steps.vulkan-version.outputs.version }}

      - name: Download iOS slice libraries
        uses: actions/download-artifact@v8
        with:
          pattern: internal-ios-slice-*
          path: bin
          merge-multiple: true

      - name: Package exporter-ready ios.zip
        run: |
          mkdir -p release-out
          uv run --project cafecito cafecito-build package-ios-template \
            --bin-dir bin \
            --output-zip release-out/ios.zip

      - name: Upload iOS bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-ios-bundle
          path: release-out/*
          retention-days: 1

  build-apple-libgodot:
    name: Build Apple LibGodot (${{ matrix.slice }})
    if: inputs.build_apple_libgodot
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: macos-arm64
            output_filename: libgodot.macos.template_release.arm64.dylib
            include_generated_header: true
          - slice: macos-x86_64
            output_filename: libgodot.macos.template_release.x86_64.dylib
            include_generated_header: false
          - slice: ios-arm64-device
            output_filename: libgodot.ios.template_release.arm64.a
            include_generated_header: false
          - slice: ios-arm64-simulator
            output_filename: libgodot.ios.template_release.arm64.simulator.a
            include_generated_header: false
    outputs:
      xcode_version: ${{ steps.xcode.outputs.xcode_version }}
      ios_sdk_version: ${{ steps.xcode.outputs.ios_sdk_version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0

      - name: Select and verify Xcode / iOS SDK
        id: xcode
        run: uv run --project cafecito cafecito-build select-xcode --min-ios-sdk "${REQUIRED_IOS_SDK_MAJOR}"

      - name: Ensure zstd is available
        run: command -v zstd >/dev/null || brew install zstd

      - name: Restore SCons cache
        id: restore-cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: ${{ env.SCONS_CACHE_DIR }}
          key: release-v3-apple-libgodot-${{ matrix.slice }}-sdk-${{ steps.xcode.outputs.ios_sdk_version }}-${{ github.sha }}
          restore-keys: |
            release-v3-apple-libgodot-${{ matrix.slice }}-sdk-${{ steps.xcode.outputs.ios_sdk_version }}-
            release-v2-apple-libgodot-sdk-${{ steps.xcode.outputs.ios_sdk_version }}-
            apple-libgodot-sdk-${{ steps.xcode.outputs.ios_sdk_version }}-

      - name: Record build start timestamp
        run: |
          sleep 1
          echo "CACHE_TIMESTAMP=$(date +%s)" >> "${GITHUB_ENV}"

      - name: Build Apple LibGodot slice and Relink Kit
        run: |
          mkdir -p release-out libgodot-slice-stage/bin
          uv run --project cafecito --with "scons==${SCONS_VERSION}" cafecito-build build-apple-libgodot \
            --configuration release \
            --slice "${{ matrix.slice }}" \
            --kit-output-dir release-out \
            --extra-flag "cache_path=${SCONS_CACHE_DIR}" \
            --extra-flag "cache_limit=${SCONS_CACHE_LIMIT_GIB}"
          cp "bin/${{ matrix.output_filename }}" libgodot-slice-stage/bin/
          if [ "${{ matrix.include_generated_header }}" = "true" ]; then
            mkdir -p libgodot-slice-stage/core/extension
            cp core/extension/gdextension_interface.gen.h libgodot-slice-stage/core/extension/
          fi

      - name: Prune SCons cache
        id: prune-cache
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: |
          python3 misc/scripts/purge_cache.py "${CACHE_TIMESTAMP}" "${SCONS_CACHE_DIR}"
          if [ -d "${SCONS_CACHE_DIR}" ] && [ -n "$(find "${SCONS_CACHE_DIR}" -mindepth 2 -type f -print -quit)" ]; then
            echo "has_files=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_files=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Save SCons cache
        if: steps.prune-cache.outputs.has_files == 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ env.SCONS_CACHE_DIR }}
          key: release-v3-apple-libgodot-${{ matrix.slice }}-sdk-${{ steps.xcode.outputs.ios_sdk_version }}-${{ github.sha }}

      - name: Upload Apple LibGodot Relink Kit
        uses: actions/upload-artifact@v7
        with:
          name: release-apple-libgodot-kit-${{ matrix.slice }}
          path: release-out/*
          retention-days: 1

      - name: Upload Apple LibGodot slice input
        uses: actions/upload-artifact@v7
        with:
          name: internal-apple-libgodot-slice-${{ matrix.slice }}
          path: libgodot-slice-stage
          retention-days: 1

  package-apple-libgodot:
    name: Package Apple LibGodot SDK
    needs:
      - build-apple-libgodot
      - build-macos-arm64
    if: inputs.build_apple_libgodot && inputs.build_macos_arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0

      - name: Download Apple LibGodot slices
        uses: actions/download-artifact@v8
        with:
          pattern: internal-apple-libgodot-slice-*
          path: .
          merge-multiple: true

      - name: Download macOS extension API
        uses: actions/download-artifact@v8
        with:
          name: internal-macos-extension-api
          path: extension-api-in

      - name: Package Apple LibGodot SDK archive
        run: |
          mkdir -p release-out
          uv run --project cafecito cafecito-build package-apple-libgodot \
            --configuration release \
            --extension-api extension-api-in/extension_api.json \
            --output release-out/apple-libgodot-release.zip
          unzip -l release-out/apple-libgodot-release.zip

      - name: Upload Apple LibGodot SDK archive
        uses: actions/upload-artifact@v7
        with:
          name: release-apple-libgodot-sdk
          path: release-out/*
          retention-days: 1

  package-apple-libgodot-standalone:
    name: Package Apple LibGodot SDK (Standalone)
    needs:
      - build-apple-libgodot
    if: inputs.build_apple_libgodot && !inputs.build_macos_arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0

      - name: Configure Xcode toolchain PATH
        run: |
          toolchain_bin="$(dirname "$(xcrun --find clang)")"
          echo "${toolchain_bin}" >> "${GITHUB_PATH}"

      - name: Download Apple LibGodot slices
        uses: actions/download-artifact@v8
        with:
          pattern: internal-apple-libgodot-slice-*
          path: .
          merge-multiple: true

      - name: Restore SCons cache for fallback editor
        id: restore-cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: ${{ env.SCONS_CACHE_DIR }}
          key: release-v3-apple-libgodot-editor-${{ github.sha }}
          restore-keys: |
            release-v3-apple-libgodot-editor-

      - name: Record build start timestamp
        run: |
          sleep 1
          echo "CACHE_TIMESTAMP=$(date +%s)" >> "${GITHUB_ENV}"

      - name: Package Apple LibGodot SDK archive
        run: |
          mkdir -p release-out
          uv run --project cafecito --with "scons==${SCONS_VERSION}" cafecito-build package-apple-libgodot \
            --configuration release \
            --output release-out/apple-libgodot-release.zip \
            --extra-flag "cache_path=${SCONS_CACHE_DIR}" \
            --extra-flag "cache_limit=${SCONS_CACHE_LIMIT_GIB}"
          unzip -l release-out/apple-libgodot-release.zip

      - name: Prune SCons cache
        id: prune-cache
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: |
          python3 misc/scripts/purge_cache.py "${CACHE_TIMESTAMP}" "${SCONS_CACHE_DIR}"
          if [ -d "${SCONS_CACHE_DIR}" ] && [ -n "$(find "${SCONS_CACHE_DIR}" -mindepth 2 -type f -print -quit)" ]; then
            echo "has_files=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_files=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Save SCons cache
        if: steps.prune-cache.outputs.has_files == 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ env.SCONS_CACHE_DIR }}
          key: release-v3-apple-libgodot-editor-${{ github.sha }}

      - name: Upload Apple LibGodot SDK archive
        uses: actions/upload-artifact@v7
        with:
          name: release-apple-libgodot-sdk
          path: release-out/*
          retention-days: 1

  build-android:
    name: Build Android (${{ matrix.target }} / ${{ matrix.arch }})
    if: inputs.build_android
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [template_release, template_debug]
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0

      - name: Install Android NDK 29
        run: |
          if [ ! -d "${ANDROID_HOME}/ndk/29.0.14206865" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865"
          fi

      - name: Restore SCons cache
        id: restore-cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: ${{ env.SCONS_CACHE_DIR }}
          key: release-v3-android-${{ matrix.target }}-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            release-v3-android-${{ matrix.target }}-${{ matrix.arch }}-
            release-v2-android-
            android-

      - name: Record build start timestamp
        run: |
          sleep 1
          echo "CACHE_TIMESTAMP=$(date +%s)" >> "${GITHUB_ENV}"

      - name: Build Android slice and Relink Kit
        run: |
          mkdir -p release-out
          uv run --project cafecito --with "scons==${SCONS_VERSION}" cafecito-build build \
            --platform android \
            --target "${{ matrix.target }}" \
            --arch "${{ matrix.arch }}" \
            --extra-flag "cache_path=${SCONS_CACHE_DIR}" \
            --extra-flag "cache_limit=${SCONS_CACHE_LIMIT_GIB}"
          uv run --project cafecito cafecito-build package-relink-kit \
            --manifest "bin/libgodot.android.${{ matrix.target }}.${{ matrix.arch }}.so.relink.json" \
            --output-dir release-out

      - name: Prune SCons cache
        id: prune-cache
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: |
          python3 misc/scripts/purge_cache.py "${CACHE_TIMESTAMP}" "${SCONS_CACHE_DIR}"
          if [ -d "${SCONS_CACHE_DIR}" ] && [ -n "$(find "${SCONS_CACHE_DIR}" -mindepth 2 -type f -print -quit)" ]; then
            echo "has_files=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_files=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Save SCons cache
        if: steps.prune-cache.outputs.has_files == 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ env.SCONS_CACHE_DIR }}
          key: release-v3-android-${{ matrix.target }}-${{ matrix.arch }}-${{ github.sha }}

      - name: Upload Android Relink Kit
        uses: actions/upload-artifact@v7
        with:
          name: release-android-kit-${{ matrix.target }}-${{ matrix.arch }}
          path: release-out/*
          retention-days: 1

      - name: Upload Android JNI libraries for APK packaging
        uses: actions/upload-artifact@v7
        with:
          name: internal-android-jni-${{ matrix.target }}-${{ matrix.arch }}
          path: platform/android/java/lib/libs
          retention-days: 1

  package-android:
    name: Package Android Template APKs
    needs: [build-android]
    if: inputs.build_android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Download Android JNI libraries
        uses: actions/download-artifact@v8
        with:
          pattern: internal-android-jni-*
          path: platform/android/java/lib/libs
          merge-multiple: true

      - name: Generate Android template APKs
        run: |
          mkdir -p release-out
          (cd platform/android/java && uv run --with "scons==${SCONS_VERSION}" -- ./gradlew generateGodotTemplates)
          uv run --project cafecito cafecito-build package-android-templates \
            --bin-dir bin \
            --output-zip release-out/android.zip \
            --abi arm64-v8a \
            --abi x86_64

      - name: Upload Android bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-android-bundle
          path: release-out/*
          retention-days: 1

  build-linux:
    name: Build Linux Template (${{ matrix.target }})
    if: inputs.build_linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [template_release, template_debug]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0

      - name: Restore SCons cache
        id: restore-cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: ${{ env.SCONS_CACHE_DIR }}
          key: release-v3-linux-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            release-v3-linux-${{ matrix.target }}-
            release-v2-linux-templates-
            linux-templates-

      - name: Record build start timestamp
        run: |
          sleep 1
          echo "CACHE_TIMESTAMP=$(date +%s)" >> "${GITHUB_ENV}"

      - name: Build Linux ${{ matrix.target }} and Relink Kit
        run: |
          mkdir -p release-out
          uv run --project cafecito --with "scons==${SCONS_VERSION}" cafecito-build build \
            --platform linuxbsd \
            --target "${{ matrix.target }}" \
            --arch x86_64 \
            --extra-flag "cache_path=${SCONS_CACHE_DIR}" \
            --extra-flag "cache_limit=${SCONS_CACHE_LIMIT_GIB}"
          strip "bin/godot.linuxbsd.${{ matrix.target }}.x86_64"
          tar czf "release-out/linux-${{ matrix.target }}.tar.gz" -C bin "godot.linuxbsd.${{ matrix.target }}.x86_64"
          uv run --project cafecito cafecito-build package-relink-kit \
            --manifest "bin/godot.linuxbsd.${{ matrix.target }}.x86_64.relink.json" \
            --output-dir release-out

      - name: Prune SCons cache
        id: prune-cache
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: |
          python3 misc/scripts/purge_cache.py "${CACHE_TIMESTAMP}" "${SCONS_CACHE_DIR}"
          if [ -d "${SCONS_CACHE_DIR}" ] && [ -n "$(find "${SCONS_CACHE_DIR}" -mindepth 2 -type f -print -quit)" ]; then
            echo "has_files=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_files=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Save SCons cache
        if: steps.prune-cache.outputs.has_files == 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ env.SCONS_CACHE_DIR }}
          key: release-v3-linux-${{ matrix.target }}-${{ github.sha }}

      - name: Upload Linux template artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.target }}
          path: release-out/*
          retention-days: 1

  build-linux-editor:
    name: Build Linux Editor
    if: inputs.build_linux_editor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0

      - name: Restore SCons cache
        id: restore-cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: ${{ env.SCONS_CACHE_DIR }}
          key: release-v2-linux-editor-${{ github.sha }}
          restore-keys: |
            release-v2-linux-editor-
            linux-editor-

      - name: Record build start timestamp
        run: |
          sleep 1
          echo "CACHE_TIMESTAMP=$(date +%s)" >> "${GITHUB_ENV}"

      - name: Build Linux editor and Relink Kit
        run: |
          mkdir -p release-out
          uv run --project cafecito --with "scons==${SCONS_VERSION}" cafecito-build build \
            --platform linuxbsd \
            --target editor \
            --arch x86_64 \
            --extra-flag "cache_path=${SCONS_CACHE_DIR}" \
            --extra-flag "cache_limit=${SCONS_CACHE_LIMIT_GIB}"
          strip bin/godot.linuxbsd.editor.x86_64
          tar czf release-out/godot_linux_editor.x86_64.tar.gz -C bin godot.linuxbsd.editor.x86_64
          uv run --project cafecito cafecito-build package-relink-kit \
            --manifest bin/godot.linuxbsd.editor.x86_64.relink.json \
            --output-dir release-out

      - name: Prune SCons cache
        id: prune-cache
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: |
          python3 misc/scripts/purge_cache.py "${CACHE_TIMESTAMP}" "${SCONS_CACHE_DIR}"
          if [ -d "${SCONS_CACHE_DIR}" ] && [ -n "$(find "${SCONS_CACHE_DIR}" -mindepth 2 -type f -print -quit)" ]; then
            echo "has_files=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_files=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Save SCons cache
        if: steps.prune-cache.outputs.has_files == 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ env.SCONS_CACHE_DIR }}
          key: release-v2-linux-editor-${{ github.sha }}

      - name: Upload Linux editor artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-editor
          path: release-out/*
          retention-days: 1

  build-windows:
    name: Build Windows Template (${{ matrix.target }})
    if: inputs.build_windows
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [template_release, template_debug]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0

      - name: Install MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Restore SCons cache
        id: restore-cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: ${{ env.SCONS_CACHE_DIR }}
          key: release-v3-windows-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            release-v3-windows-${{ matrix.target }}-
            release-v2-windows-
            windows-

      - name: Record build start timestamp
        run: |
          sleep 1
          echo "CACHE_TIMESTAMP=$(date +%s)" >> "${GITHUB_ENV}"

      - name: Build Windows ${{ matrix.target }} and Relink Kit
        run: |
          mkdir -p release-out
          uv run --project cafecito --with "scons==${SCONS_VERSION}" cafecito-build build \
            --platform windows \
            --target "${{ matrix.target }}" \
            --arch x86_64 \
            --extra-flag use_mingw=yes \
            --extra-flag d3d12=no \
            --extra-flag "cache_path=${SCONS_CACHE_DIR}" \
            --extra-flag "cache_limit=${SCONS_CACHE_LIMIT_GIB}"
          x86_64-w64-mingw32-strip "bin/godot.windows.${{ matrix.target }}.x86_64.exe"
          (cd bin && zip -q "../release-out/windows-${{ matrix.target }}.zip" "godot.windows.${{ matrix.target }}.x86_64.exe")
          uv run --project cafecito cafecito-build package-relink-kit \
            --manifest "bin/godot.windows.${{ matrix.target }}.x86_64.exe.relink.json" \
            --output-dir release-out

      - name: Prune SCons cache
        id: prune-cache
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: |
          python3 misc/scripts/purge_cache.py "${CACHE_TIMESTAMP}" "${SCONS_CACHE_DIR}"
          if [ -d "${SCONS_CACHE_DIR}" ] && [ -n "$(find "${SCONS_CACHE_DIR}" -mindepth 2 -type f -print -quit)" ]; then
            echo "has_files=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_files=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Save SCons cache
        if: steps.prune-cache.outputs.has_files == 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ env.SCONS_CACHE_DIR }}
          key: release-v3-windows-${{ matrix.target }}-${{ github.sha }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.target }}
          path: release-out/*
          retention-days: 1

  create-release:
    name: Create Public GitHub Release
    needs:
      - generate-tag
      - build-macos-arm64
      - package-macos-arm64
      - build-ios
      - package-ios
      - build-apple-libgodot
      - package-apple-libgodot
      - package-apple-libgodot-standalone
      - build-android
      - package-android
      - build-linux
      - build-linux-editor
      - build-windows
    if: |
      always() &&
      inputs.publish_release &&
      needs.generate-tag.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0

      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256SUMS.txt
        run: |
          uv run --project cafecito cafecito-build checksums --directory artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.generate-tag.outputs.release_tag }}
          name: Cafecito Godot ${{ needs.generate-tag.outputs.release_tag }}
          draft: false
          prerelease: false
          files: artifacts/*
          body: |
            # Cafecito Godot ${{ needs.generate-tag.outputs.release_tag }}

            Public open-source build of the Cafecito Godot fork (`${{ needs.generate-tag.outputs.template_version }}`) plus portable `.tar.zst` Relink Kits.

            - Commit: `${{ github.sha }}`
            - Template Version: `${{ needs.generate-tag.outputs.template_version }}`
            - iOS Toolchain: `${{ needs.build-ios.outputs.xcode_version || needs.build-apple-libgodot.outputs.xcode_version || 'n/a' }}` (iPhoneOS SDK `${{ needs.build-ios.outputs.ios_sdk_version || needs.build-apple-libgodot.outputs.ios_sdk_version || 'n/a' }}`, floor `>= ${{ env.REQUIRED_IOS_SDK_MAJOR }}`)
            - Checksums: `SHA256SUMS.txt`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
