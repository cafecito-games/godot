name: Build Public Godot Fork & Relink Kits

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag override (leave empty to auto-generate as v{godot}-{date}.{N})'
        required: false
        type: string
        default: ''
      build_macos_arm64:
        description: 'Build macOS Apple Silicon editor + templates + Relink Kits'
        required: false
        type: boolean
        default: true
      build_ios:
        description: 'Build iOS templates (device arm64 + simulator arm64) + Relink Kits'
        required: false
        type: boolean
        default: true
      build_apple_libgodot:
        description: 'Build Apple LibGodot SDK (release slices) + Relink Kits'
        required: false
        type: boolean
        default: false
      build_android:
        description: 'Build Android templates (arm64-v8a + x86_64) + Relink Kits'
        required: false
        type: boolean
        default: false
      build_linux:
        description: 'Build Linux x86_64 templates (linux-template_release/debug.tar.gz) + Relink Kits'
        required: false
        type: boolean
        default: true
      build_linux_editor:
        description: 'Build Linux x86_64 editor + Relink Kit'
        required: false
        type: boolean
        default: false
      build_windows:
        description: 'Build Windows x86_64 templates (MinGW) + Relink Kits'
        required: false
        type: boolean
        default: false

env:
  SCONS_CACHE: ${{ github.workspace }}/.scons-cache
  SCONS_CACHE_LIMIT: 7168
  REQUIRED_IOS_SDK_MAJOR: '27'

jobs:
  generate-tag:
    name: Generate Release Tag
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      template_version: ${{ steps.tag.outputs.template_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Derive release tag and template version
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GODOT_VERSION=$(grep -E '^(major|minor|patch) = [0-9]+' version.py | awk -F' = ' '{print $2}' | tr '\n' '.' | sed 's/\.$//')
          GODOT_STATUS=$(awk -F' = ' '/^status = / {gsub(/"/, "", $2); print $2}' version.py)
          echo "template_version=${GODOT_VERSION}.${GODOT_STATUS}" >> "$GITHUB_OUTPUT"

          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "release_tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DATE=$(date -u +%Y%m%d)
          COUNT=$(gh release list --repo "${{ github.repository }}" --limit 100 \
            --json tagName \
            --jq "[.[] | select(.tagName | startswith(\"v${GODOT_VERSION}-${DATE}.\"))] | length")
          NEXT=$((COUNT + 1))
          echo "release_tag=v${GODOT_VERSION}-${DATE}.${NEXT}" >> "$GITHUB_OUTPUT"

  build-macos-arm64:
    name: Build macOS (arm64)
    if: inputs.build_macos_arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Install build dependencies
        run: brew install scons yasm zstd

      - name: Install Vulkan SDK
        run: bash misc/scripts/install_vulkan_sdk_macos.sh

      - name: Restore SCons cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.scons-cache
          key: macos-arm64-${{ hashFiles('core/**/*.h', 'core/**/*.cpp', 'SConstruct') }}
          restore-keys: macos-arm64-

      - name: Build macOS arm64 editor and templates
        run: |
          uv run --project cafecito cafecito-build build --platform macos --target editor --arch arm64
          uv run --project cafecito cafecito-build build --platform macos --target template_release --arch arm64
          uv run --project cafecito cafecito-build build --platform macos --target template_debug --arch arm64

      - name: Package public macOS bundles and Relink Kits
        run: |
          mkdir -p release-out
          uv run --project cafecito cafecito-build package-macos-editor \
            --editor-binary bin/godot.macos.editor.arm64 \
            --output release-out/godot_macos_editor.arm64.zip
          uv run --project cafecito cafecito-build package-macos-template \
            --release-binary bin/godot.macos.template_release.arm64 \
            --debug-binary bin/godot.macos.template_debug.arm64 \
            --output release-out/macos-arm64.zip
          for manifest in bin/godot.macos.*.arm64.relink.json; do
            uv run --project cafecito cafecito-build package-relink-kit --manifest "$manifest" --output-dir release-out
          done

      - name: Upload macOS arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: release-out/*
          retention-days: 1

  build-ios:
    name: Build iOS Templates
    if: inputs.build_ios
    runs-on: xcode-27
    outputs:
      xcode_version: ${{ steps.xcode.outputs.xcode_version }}
      ios_sdk_version: ${{ steps.xcode.outputs.ios_sdk_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Select and verify Xcode / iOS SDK
        id: xcode
        run: uv run --project cafecito cafecito-build select-xcode --min-ios-sdk "${REQUIRED_IOS_SDK_MAJOR}"

      - name: Install build dependencies
        run: brew install scons yasm zstd

      - name: Install Vulkan SDK (MoltenVK for ios.zip)
        run: bash misc/scripts/install_vulkan_sdk_macos.sh

      - name: Restore SCons cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.scons-cache
          key: ios-sdk-${{ steps.xcode.outputs.ios_sdk_version }}-${{ hashFiles('core/**/*.h', 'core/**/*.cpp', 'SConstruct') }}
          restore-keys: ios-sdk-${{ steps.xcode.outputs.ios_sdk_version }}-

      - name: Build iOS slices (release + debug; device + simulator)
        run: |
          for target in template_release template_debug; do
            uv run --project cafecito cafecito-build build --platform ios --target "$target" --arch arm64 --extra-flag ios_simulator=no
            uv run --project cafecito cafecito-build build --platform ios --target "$target" --arch arm64 --extra-flag ios_simulator=yes
          done

      - name: Generate and finalize ios.zip + Relink Kits
        run: |
          mkdir -p release-out
          uv run --project cafecito cafecito-build build --platform ios --target template_release --arch arm64 --no-relink-kit --extra-flag generate_bundle=yes
          uv run --project cafecito cafecito-build finalize-ios-template \
            --input-zip bin/godot_ios.zip \
            --output-zip release-out/ios.zip
          for manifest in bin/libgodot.ios.*.relink.json; do
            uv run --project cafecito cafecito-build package-relink-kit --manifest "$manifest" --output-dir release-out
          done

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: release-out/*
          retention-days: 1

  build-apple-libgodot:
    name: Build Apple LibGodot SDK
    if: inputs.build_apple_libgodot
    runs-on: xcode-27
    outputs:
      xcode_version: ${{ steps.xcode.outputs.xcode_version }}
      ios_sdk_version: ${{ steps.xcode.outputs.ios_sdk_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Select and verify Xcode / iOS SDK
        id: xcode
        run: uv run --project cafecito cafecito-build select-xcode --min-ios-sdk "${REQUIRED_IOS_SDK_MAJOR}"

      - name: Install build dependencies
        run: brew install scons yasm zstd

      - name: Restore SCons cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.scons-cache
          key: apple-libgodot-sdk-${{ steps.xcode.outputs.ios_sdk_version }}-${{ hashFiles('core/**/*.h', 'core/**/*.cpp', 'SConstruct') }}
          restore-keys: |
            apple-libgodot-sdk-${{ steps.xcode.outputs.ios_sdk_version }}-
            ios-sdk-${{ steps.xcode.outputs.ios_sdk_version }}-

      - name: Build and package Apple LibGodot SDK + Relink Kits
        run: |
          mkdir -p release-out
          uv run --project cafecito cafecito-build build-apple-libgodot --configuration release
          uv run --project cafecito cafecito-build package-apple-libgodot \
            --configuration release \
            --output release-out/apple-libgodot-release.zip
          for manifest in bin/libgodot.*.relink.json; do
            uv run --project cafecito cafecito-build package-relink-kit --manifest "$manifest" --output-dir release-out
          done

      - name: Upload Apple LibGodot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apple-libgodot
          path: release-out/*
          retention-days: 1

  build-android:
    name: Build Android Templates
    if: inputs.build_android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SCons and zstd
        run: |
          sudo apt-get update
          sudo apt-get install -y scons zstd

      - name: Install Android NDK 29
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865"

      - name: Restore SCons cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.scons-cache
          key: android-${{ hashFiles('core/**/*.h', 'core/**/*.cpp', 'SConstruct') }}
          restore-keys: android-

      - name: Build Android native slices and package Relink Kits
        run: |
          mkdir -p release-out
          for target in template_release template_debug; do
            for arch in arm64 x86_64; do
              uv run --project cafecito cafecito-build build --platform android --target "$target" --arch "$arch"
              uv run --project cafecito cafecito-build package-relink-kit \
                --manifest "bin/libgodot.android.${target}.${arch}.so.relink.json" \
                --output-dir release-out
            done
          done

      - name: Generate Android template APKs
        run: |
          (cd platform/android/java && ./gradlew generateGodotTemplates)
          uv run --project cafecito cafecito-build package-android-templates \
            --bin-dir bin \
            --output-zip release-out/android.zip \
            --abi arm64-v8a \
            --abi x86_64

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: release-out/*
          retention-days: 1

  build-linux:
    name: Build Linux Templates
    if: inputs.build_linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential scons pkg-config zstd libx11-dev libxcursor-dev \
            libxinerama-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev \
            libudev-dev libxi-dev libxrandr-dev yasm

      - name: Restore SCons cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.scons-cache
          key: linux-templates-${{ hashFiles('core/**/*.h', 'core/**/*.cpp', 'SConstruct') }}
          restore-keys: linux-templates-

      - name: Build Linux release and debug templates
        run: |
          mkdir -p release-out
          for target in template_release template_debug; do
            uv run --project cafecito cafecito-build build --platform linuxbsd --target "$target" --arch x86_64
            strip "bin/godot.linuxbsd.${target}.x86_64"
            tar czf "release-out/linux-${target}.tar.gz" -C bin "godot.linuxbsd.${target}.x86_64"
            uv run --project cafecito cafecito-build package-relink-kit \
              --manifest "bin/godot.linuxbsd.${target}.x86_64.relink.json" \
              --output-dir release-out
          done

      - name: Upload Linux template artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-templates
          path: release-out/*
          retention-days: 1

  build-linux-editor:
    name: Build Linux Editor
    if: inputs.build_linux_editor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential scons pkg-config zstd libx11-dev libxcursor-dev \
            libxinerama-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev \
            libudev-dev libxi-dev libxrandr-dev yasm

      - name: Restore SCons cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.scons-cache
          key: linux-editor-${{ hashFiles('core/**/*.h', 'core/**/*.cpp', 'SConstruct') }}
          restore-keys: linux-editor-

      - name: Build Linux editor and Relink Kit
        run: |
          mkdir -p release-out
          uv run --project cafecito cafecito-build build --platform linuxbsd --target editor --arch x86_64
          strip bin/godot.linuxbsd.editor.x86_64
          tar czf release-out/godot_linux_editor.x86_64.tar.gz -C bin godot.linuxbsd.editor.x86_64
          uv run --project cafecito cafecito-build package-relink-kit \
            --manifest bin/godot.linuxbsd.editor.x86_64.relink.json \
            --output-dir release-out

      - name: Upload Linux editor artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-editor
          path: release-out/*
          retention-days: 1

  build-windows:
    name: Build Windows Templates (MinGW)
    if: inputs.build_windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Install MinGW and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential scons pkg-config zstd yasm mingw-w64 zip
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Restore SCons cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.scons-cache
          key: windows-${{ hashFiles('core/**/*.h', 'core/**/*.cpp', 'SConstruct') }}
          restore-keys: windows-

      - name: Build Windows templates and Relink Kits
        run: |
          mkdir -p release-out
          for target in template_release template_debug; do
            uv run --project cafecito cafecito-build build \
              --platform windows \
              --target "$target" \
              --arch x86_64 \
              --extra-flag use_mingw=yes \
              --extra-flag d3d12=no
            x86_64-w64-mingw32-strip "bin/godot.windows.${target}.x86_64.exe"
            (cd bin && zip -q "../release-out/windows-${target}.zip" "godot.windows.${target}.x86_64.exe")
            uv run --project cafecito cafecito-build package-relink-kit \
              --manifest "bin/godot.windows.${target}.x86_64.exe.relink.json" \
              --output-dir release-out
          done

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release-out/*
          retention-days: 1

  create-release:
    name: Create Public GitHub Release
    needs:
      - generate-tag
      - build-macos-arm64
      - build-ios
      - build-apple-libgodot
      - build-android
      - build-linux
      - build-linux-editor
      - build-windows
    if: |
      always() &&
      needs.generate-tag.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256SUMS.txt
        run: |
          uv run --project cafecito cafecito-build checksums --directory artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.generate-tag.outputs.release_tag }}
          name: Cafecito Godot ${{ needs.generate-tag.outputs.release_tag }}
          draft: false
          prerelease: false
          files: artifacts/*
          body: |
            # Cafecito Godot ${{ needs.generate-tag.outputs.release_tag }}

            Public open-source build of the Cafecito Godot fork (`${{ needs.generate-tag.outputs.template_version }}`) plus portable `.tar.zst` Relink Kits.

            - Commit: `${{ github.sha }}`
            - Template Version: `${{ needs.generate-tag.outputs.template_version }}`
            - iOS Toolchain: `${{ needs.build-ios.outputs.xcode_version || needs.build-apple-libgodot.outputs.xcode_version || 'n/a' }}` (iPhoneOS SDK `${{ needs.build-ios.outputs.ios_sdk_version || needs.build-apple-libgodot.outputs.ios_sdk_version || 'n/a' }}`, floor `>= ${{ env.REQUIRED_IOS_SDK_MAJOR }}`)
            - Checksums: `SHA256SUMS.txt`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
