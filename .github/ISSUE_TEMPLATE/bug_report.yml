name: Cafecito fork bug report
description: Report a problem specific to Cafecito Games' Godot fork
title: "[Bug]: "

body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us improve the engine we ship.

        This tracker is for problems caused by this fork's engine changes, build tooling, release packaging, extension/security seams, or Apple embedding support. If the problem also occurs in an official Godot build, please report it to [Godot's issue tracker](https://github.com/godotengine/godot/issues) so the fix can reach everyone. If you are unsure, tell us what you tested below.

        Please search this repository's [open issues](https://github.com/cafecito-games/godot/issues) and [closed issues](https://github.com/cafecito-games/godot/issues?q=is%3Aissue+is%3Aclosed) first, and open one issue per bug.

  - type: dropdown
    id: area
    attributes:
      label: Fork area
      description: Which part of this fork appears to be involved?
      options:
        - Engine fix carried by this fork
        - Build tooling or Relink Kit
        - Release packaging
        - Extension or security seam
        - Apple embedding or LibGodot
        - Other or unsure
    validations:
      required: true

  - type: input
    id: build
    attributes:
      label: Cafecito build identity
      description: Copy the full version shown by the editor or project manager, such as `cafecito.1a2b3c4d5` or `cafecito.1a2b3c4d5.extension-id`.
      placeholder: cafecito.1a2b3c4d5
    validations:
      required: true

  - type: textarea
    id: comparison
    attributes:
      label: Official Godot comparison
      description: State whether the problem occurs in the corresponding official Godot release. Include the versions tested. If you could not compare them, explain why.
      placeholder: |
        Reproducible in: cafecito.1a2b3c4d5
        Not reproducible in: Godot 4.7.2-stable
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: System information
      description: Include the OS and architecture. For graphics or platform-specific bugs, also include relevant hardware, driver, and rendering backend details. In the editor, use Help > Copy System Info.
      placeholder: macOS 27.0, Apple M4 Pro, arm64, Metal
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Issue description
      description: Explain what happened, what you expected, and why you believe the problem is specific to this fork. Paste searchable logs and errors as text rather than screenshots.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that reproduces the problem, including relevant build commands and flags.
    validations:
      required: true

  - type: textarea
    id: mrp
    attributes:
      label: Minimal reproduction project or files
      description: Attach a small project, manifest, log, or other file that demonstrates the problem. Omit generated `.godot` content and sensitive or proprietary material. Write "N/A" if no project or file is needed.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other useful details, screenshots, bisect results, or suspected commits.
