blank_issues_enabled: false

contact_links:
  - name: General Godot bug
    url: https://github.com/godotengine/godot/issues/new/choose
    about: Report bugs that also occur in official Godot builds to the upstream project.

  - name: Godot feature proposal
    url: https://github.com/godotengine/godot-proposals/issues/new/choose
    about: Propose general engine features to the upstream Godot project.

  - name: Godot documentation issue
    url: https://github.com/godotengine/godot-docs/issues/new/choose
    about: Report problems with the official Godot documentation upstream.

  - name: Godot help and support
    url: https://godotengine.org/community
    about: Ask usage and troubleshooting questions in the Godot community channels.
