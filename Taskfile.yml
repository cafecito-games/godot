version: '3'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  info:
    desc: Show host, Godot version, and build identity information
    cmds:
      - uv run --project cafecito cafecito-build info

  build:editor:
    desc: Build the Godot editor for the current host (with Relink Kit manifest)
    cmds:
      - uv run --project cafecito cafecito-build build --target editor {{.CLI_ARGS}}

  build:template-release:
    desc: Build the Godot release export template for the current host (with Relink Kit manifest)
    cmds:
      - uv run --project cafecito cafecito-build build --target template_release {{.CLI_ARGS}}

  build:template-debug:
    desc: Build the Godot debug export template for the current host (with Relink Kit manifest)
    cmds:
      - uv run --project cafecito cafecito-build build --target template_debug {{.CLI_ARGS}}

  build:all:
    desc: Build editor, release template, and debug template for the current host
    cmds:
      - task: build:editor
      - task: build:template-release
      - task: build:template-debug

  build:libgodot:release:
    desc: Build release Apple LibGodot SDK slices (macOS dylibs + iOS static libs + Relink Kits)
    cmds:
      - uv run --project cafecito cafecito-build build-apple-libgodot --configuration release {{.CLI_ARGS}}

  build:libgodot:debug:
    desc: Build debug Apple LibGodot SDK slices (macOS dylibs + iOS static libs + Relink Kits)
    cmds:
      - uv run --project cafecito cafecito-build build-apple-libgodot --configuration debug {{.CLI_ARGS}}

  package:libgodot:release:
    desc: Package release Apple LibGodot SDK archive (apple-libgodot-release.zip)
    cmds:
      - uv run --project cafecito cafecito-build package-apple-libgodot --configuration release {{.CLI_ARGS}}

  package:libgodot:debug:
    desc: Package debug Apple LibGodot SDK archive (apple-libgodot-debug.zip)
    cmds:
      - uv run --project cafecito cafecito-build package-apple-libgodot --configuration debug {{.CLI_ARGS}}

  package:relink-kit:
    desc: 'Package a Relink Kit from a .relink.json manifest (usage: task package:relink-kit -- --manifest bin/<name>.relink.json)'
    cmds:
      - uv run --project cafecito cafecito-build package-relink-kit {{.CLI_ARGS}}

  bench:gdscript:
    desc: 'Run the GDScript performance benchmark suite (pass flags after --, e.g. -- --target release --runs 3)'
    cmds:
      - python3 cafecito/benchmarks/gdscript/benchmark.py run {{.CLI_ARGS}}

  bench:gdscript:compare:
    desc: 'Compare two GDScript benchmark JSON snapshots (usage: task bench:gdscript:compare -- base.json cand.json)'
    cmds:
      - python3 cafecito/benchmarks/gdscript/benchmark.py compare {{.CLI_ARGS}}

  clean:
    desc: Remove bin/ build artifacts
    cmds:
      - uv run --project cafecito cafecito-build clean
